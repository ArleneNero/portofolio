name: Publish Modern Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'modern/**'
      - '.github/workflows/publish-modern.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-static-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: modern
      - name: Lint
        run: npm run lint
        working-directory: modern
      - name: Unit tests
        run: npm run test
        working-directory: modern
      - name: Build Pages site
        run: npm run build
        working-directory: modern
      - name: Publish compiled files to branch-based Pages root
        run: |
          cp -a modern/dist/. ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets favicon.svg projects profile
          if ! git diff --cached --quiet; then
            git commit -m "build: publish modern portfolio for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
